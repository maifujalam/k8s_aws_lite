apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: icmp-external
  namespace: monitoring
spec:
  scrapeInterval: 10s
  module: icmp
  staticConfig:
    targets:
      - 8.8.8.8       # Google DNS
      - 13.207.12.184 # Example external IP
  relabelConfigs:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: blackbox-exporter-dev-prometheus-blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
