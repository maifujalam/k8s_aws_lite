apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  name: adzn7ll
  labels: {}
  annotations: {}
spec:
  annotations:
    - kind: AnnotationQuery
      spec:
        query:
          kind: DataQuery
          group: grafana
          version: v0
          spec: {}
          labels:
            grafana.app/export-label: grafana-1
        enable: true
        hide: true
        iconColor: rgba(0, 211, 255, 1)
        name: Annotations & Alerts
        builtIn: true
  cursorSync: 'Off'
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        id: 1
        title: New panel
        description: ''
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: prometheus
                    version: v0
                    spec:
                      editorMode: builder
                      expr: count:up0
                      legendFormat: __auto
                      range: true
                    labels:
                      grafana.app/export-label: prometheus-1
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: stat
          version: 13.0.1
          spec:
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                  - lastNotNull
                fields: ''
                values: false
              showPercentChange: false
              textMode: auto
              wideLayout: true
            fieldConfig:
              defaults:
                thresholds:
                  mode: absolute
                  steps:
                    - value: 0
                      color: green
                    - value: 80
                      color: red
                color:
                  mode: thresholds
              overrides: []
  layout:
    kind: GridLayout
    spec:
      items:
        - kind: GridLayoutItem
          spec:
            x: 0
            'y': 0
            width: 12
            height: 8
            element:
              kind: ElementReference
              name: panel-1
  links: []
  liveNow: false
  preload: false
  tags: []
  timeSettings:
    timezone: browser
    from: now-6h
    to: now
    autoRefresh: ''
    autoRefreshIntervals:
      - 5s
      - 10s
      - 30s
      - 1m
      - 5m
      - 15m
      - 30m
      - 1h
      - 2h
      - 1d
    hideTimepicker: false
    fiscalYearStartMonth: 0
  title: New dashboard
  variables: []
  preferences:
    layout:
      kind: GridLayout
      spec:
        items: []
