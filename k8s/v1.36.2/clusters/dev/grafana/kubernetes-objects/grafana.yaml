kind: List
metadata:
  name: grafana
  namespace: grafana
apiVersion: v1
items:
- apiVersion: grafana.integreatly.org/v1beta1
  kind: Grafana
  metadata:
    annotations:
    generation: 2
    labels:
      dashboards: grafana
    name: grafana
    namespace: grafana
  spec:
    client:
      timeout: 5
    config:
      analytics:
        check_for_updates: "false"
        reporting_enabled: "false"
      auth:
        disable_login_form: "false"
      log:
        mode: console
      security:
        admin_password: alam
        admin_user: admin
        disable_gravatar: "false"
    deployment:
      spec:
        replicas: 1
        strategy:
          type: Recreate
        template:
          spec:
            containers:
            - name: grafana
              securityContext:
                readOnlyRootFilesystem: false
    ingress:
      spec:
        ingressClassName: nginx
        rules:
        - host: grafana.maifuj.com
          http:
            paths:
            - backend:
                service:
                  name: grafana-service
                  port:
                    number: 3000
              path: /
              pathType: Prefix
    version: 13.0.1
