apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: gateway-tcp
  namespace: istio-ingress
spec:
  selector:
    istio: ingress-dev
  servers:
    # Kubernetes API — must be PASSTHROUGH, see below
    - port: {number: 6443, name: tls-k8s, protocol: TLS}
      hosts: ["kubernetes.maifuj.com"]
      tls:
        mode: PASSTHROUGH

    # Redis — TLS terminated at the gateway, plain TCP to the backend
    - port: {number: 6379, name: tls-redis, protocol: TLS}
      hosts: ["redis.maifuj.com"]
      tls:
        mode: SIMPLE
        credentialName: wildcard-certificate-secret