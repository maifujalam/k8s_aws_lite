apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: gateway-tls-passthrough
  namespace: istio-ingress
spec:
  selector:
    istio: ingress-dev
  servers:
    - port:
        number: 443
        name: tls-passthrough
        protocol: HTTPS
      hosts:
        - vault.maifuj.com
        - elastic.maifuj.com
      tls:
        mode: PASSTHROUGH
