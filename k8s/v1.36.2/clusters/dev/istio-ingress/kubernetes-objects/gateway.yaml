apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: wildcard-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: ingress-dev
  servers:
    - port: {number: 443, name: https, protocol: HTTPS}
      hosts: ["*.maifuj.com"]
      tls:
        mode: SIMPLE
        credentialName: wildcard-example-tls
    - port: { number: 80, name: http, protocol: HTTP }
      hosts: [ "*.maifuj.com" ]